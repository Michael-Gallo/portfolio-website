stages:
  - test
  - build
  - smoke

variables:
  BUNDLE_PATH: vendor/bundle
  DOCKER_TLS_CERTDIR: ""

rails-test:
  stage: test
  image: ruby:3.4.8
  cache:
    key: gems
    paths:
      - vendor/bundle
  script:
    - bundle install
    - bin/rails test

docker-build:
  stage: build
  image: docker:stable
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --pull -t $CI_REGISTRY_IMAGE .
    - docker push $CI_REGISTRY_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - Dockerfile

curl-test:
  stage: smoke
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $CI_REGISTRY_IMAGE
    - docker run -d -p 8080:80 -e SECRET_KEY_BASE=dummy $CI_REGISTRY_IMAGE
    - apk add curl
    - curl --fail http://docker:8080/up
    - curl --fail http://docker:8080/
    - curl --fail http://docker:8080/blog

<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="{{ .Site.Title }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
    <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:type" content="{{ if and .IsPage (eq .Type "blog") }}article{{ else }}website{{ end }}">
    <link rel="canonical" href="{{ .Permalink }}">
    {{ if and .IsPage (eq .Type "blog") }}
    <meta property="article:published_time" content="{{ .Date.Format "2006-01-02" }}">
    {{ end }}
    <link rel="icon" href="{{ "favicon.ico" | relURL }}" type="image/x-icon">
    <link rel="icon" href="{{ "icon.svg" | relURL }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ "icon.png" | relURL }}">
    <link rel="alternate" type="application/atom+xml" title="{{ .Site.Title }} Blog" href="{{ "feed.atom" | relURL }}">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,200" rel="stylesheet">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css" rel="stylesheet">
    <link href="{{ "css/aos.css" | relURL }}" rel="stylesheet">
    <link href="{{ "css/bootstrap.min.css" | relURL }}" rel="stylesheet">
    <link href="{{ "css/main.css" | relURL }}" rel="stylesheet">
    <link href="{{ "css/blog.css" | relURL }}" rel="stylesheet">
    <noscript>
      <style>
        [data-aos] {
          opacity: 1 !important;
          transform: translate(0) scale(1) !important;
        }
      </style>
    </noscript>
  </head>

  <body id="top">
    <header>
      <div class="profile-page sidebar-collapse">
        <nav class="navbar navbar-expand-lg fixed-top bg-primary {{ if .IsHome }}navbar-transparent{{ end }}" color-on-scroll="400">
          <div class="container">
            <div class="navbar-translate">
              <a class="navbar-brand" href="{{ .Site.Home.RelPermalink }}" rel="tooltip">{{ .Site.Title }}</a>
              <button class="navbar-toggler navbar-toggler" type="button" data-toggle="collapse" data-target="#navigation"
                aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation"><span
                  class="navbar-toggler-bar bar1"></span><span class="navbar-toggler-bar bar2"></span><span
                  class="navbar-toggler-bar bar3"></span></button>
            </div>
            <div class="collapse navbar-collapse justify-content-end" id="navigation">
              <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link smooth-scroll" href="{{ .Site.Home.RelPermalink }}#about">About</a></li>
                <li class="nav-item"><a class="nav-link smooth-scroll" href="{{ .Site.Home.RelPermalink }}#skill">Skills</a></li>
                <li class="nav-item"><a class="nav-link smooth-scroll" href="{{ .Site.Home.RelPermalink }}#portfolio">Portfolio</a></li>
                <li class="nav-item"><a class="nav-link smooth-scroll" href="{{ .Site.Home.RelPermalink }}#experience">Experience</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ "blog/" | relURL }}">Blog</a></li>
              </ul>
            </div>
          </div>
        </nav>
      </div>
    </header>

    {{ block "main" . }}{{ end }}

    <footer class="footer">
      <p>&copy; Creative CV. All rights reserved.<br>Design - <a class="credit" href="https://templateflip.com"
          target="_blank">TemplateFlip</a><br>ICS icon by <a class="credit"
          href="https://www.flaticon.com/free-icon/ics-format_2306102" target="_blank" rel="noopener">Flaticon</a></p>
    </footer>
    <script src="{{ "js/core/jquery.3.2.1.min.js" | relURL }}"></script>
    <script src="{{ "js/core/popper.min.js" | relURL }}"></script>
    <script src="{{ "js/core/bootstrap.min.js" | relURL }}"></script>
    <script src="{{ "js/now-ui-kit.js" | relURL }}"></script>
    <script src="{{ "js/aos.js" | relURL }}"></script>
    <script src="{{ "scripts/main.js" | relURL }}"></script>
  </body>
</html>

{{- $dest := .Destination | safeURL -}}
<img src="{{ $dest }}"
  alt="{{ with .PlainText }}{{ . }}{{ end }}"
  {{- with .Title }} title="{{ . }}"{{ end -}}
  decoding="async"
  loading="lazy"
  {{- if not (strings.HasPrefix $dest "http") -}}
    {{- $staticPath := printf "static/%s" (strings.TrimPrefix "/" $dest) -}}
    {{- if fileExists $staticPath -}}
      {{- with imageConfig $staticPath -}}
  width="{{ .Width }}"
  height="{{ .Height }}"
      {{- end -}}
    {{- end -}}
  {{- end -}}
>
